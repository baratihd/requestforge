[tox]
min_version = 4.0
env_list =
    py310-requests{231,232}
    py311-requests{231,232}
    py312-requests{231,232}
    py313-requests{231,232}
    lint
    type
skip_missing_interpreters = true

[testenv]
description = Run tests with pytest
package = wheel
wheel_build_env = .pkg
deps =
    pytest>=7.4.0
    pytest-cov>=4.1.0
    pytest-mock>=3.11.0
    responses>=0.23.0
    requests231: requests>=2.31.0,<2.32.0
    requests232: requests>=2.32.0,<2.33.0
commands =
    pytest {posargs:tests/}

[testenv:type]
description = Run mypy
deps =
    mypy>=1.10.0
    types-requests>=2.32.0
commands =
    mypy src/requestforge

[testenv:lint]
description = Run linters (ruff)
skip_install = true
deps =
    ruff>=0.1.0
commands =
    ruff check src/ tests/
    ruff format --check src/ tests/

[testenv:format]
description = Format code with ruff
skip_install = true
deps =
    ruff>=0.1.0
commands =
    ruff check --fix src/ tests/
    ruff format src/ tests/

[testenv:coverage]
description = Generate coverage report
deps =
    {[testenv]deps}
    coverage[toml]>=7.3.0
commands =
    coverage run -m pytest tests/
    coverage report
    coverage html
    coverage xml
